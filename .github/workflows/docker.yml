name: Docker image

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      viewer-ref:
        description: Branch, tag or SHA of AliTVTeam/AliTV to test
        default: master
      perl-ref:
        description: Branch, tag or SHA of AliTVTeam/AliTV-perl-interface to test
        default: master

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/alitv-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: alitv-build:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check out AliTV-perl-interface
        uses: actions/checkout@v4
        with:
          repository: AliTVTeam/AliTV-perl-interface
          ref: ${{ inputs.perl-ref || 'master' }}
          path: perl-interface

      - name: Run AliTV-perl-interface tests in the image
        run: >
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD/perl-interface:/src" alitv-build:ci
          alitv-run-tests perl /src

      - name: Check out AliTV
        uses: actions/checkout@v4
        with:
          repository: AliTVTeam/AliTV
          ref: ${{ inputs.viewer-ref || 'master' }}
          path: viewer

      - name: Run AliTV viewer tests in the image
        run: >
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD/viewer:/src" alitv-build:ci
          alitv-run-tests viewer /src

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
